<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ホッシーくん</title>
<style>
  :root {
    --text: #e8eaec;
    --muted: #9ca3af;
    --accent: #4f93e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0e0f10;
    color: var(--text);
    font-family: "Hiragino Sans", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    padding: 24px 24px 48px;
  }
  .char-wrap {
    position: relative;
    width: min(58vh, 480px);
    height: min(58vh, 480px);
  }
  .char {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    inset: 0;
    display: none;
  }
  .idle.pose-sleep .char-sleep,
  .idle.pose-done .char-done,
  .wake .char-listen,
  .working.pose-listen .char-listen,
  .working.pose-link .char-link,
  .working.pose-download .char-download,
  .working.pose-files .char-files,
  .working.pose-sheets .char-sheets,
  .working.pose-premiere .char-premiere,
  .working.pose-done .char-done {
    display: block;
  }
  .idle.pose-sleep .char-sleep { animation: sleep 3.6s ease-in-out infinite; }
  .wake .char-listen,
  .working .char {
    animation: work-bob 1.1s ease-in-out infinite;
  }
  .idle.pose-done .char-done { animation: sleep 3.6s ease-in-out infinite; }

  @keyframes sleep {
    0%, 100% { transform: translateY(8px); }
    50% { transform: translateY(0); }
  }
  @keyframes work-bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-8px) rotate(1.5deg); }
  }

  .line {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
    min-height: 1.4em;
  }
  .detail {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    max-width: 42em;
    white-space: pre-wrap;
  }
  .meter {
    display: none;
    width: min(58vh, 480px);
    height: 12px;
    background: #1e2022;
    border: 1px solid #2a2d30;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .working .meter { display: block; }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .35s ease;
  }
  .meter-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--text);
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage idle pose-sleep" id="stage">
  <div class="char-wrap">
    <img class="char char-sleep" src="/hosshy-pose-sleep.png?v=11" alt="" />
    <img class="char char-listen" src="/hosshy-pose-listen.png?v=11" alt="" />
    <img class="char char-link" src="/hosshy-pose-link.png?v=11" alt="" />
    <img class="char char-download" src="/hosshy-pose-download.png?v=11" alt="" />
    <img class="char char-files" src="/hosshy-pose-files.png?v=11" alt="" />
    <img class="char char-sheets" src="/hosshy-pose-sheets.png?v=11" alt="" />
    <img class="char char-premiere" src="/hosshy-pose-premiere.png?v=11" alt="" />
    <img class="char char-done" src="/hosshy-pose-done.png?v=11" alt="" />
  </div>
  <div class="line" id="line">zzz…</div>
  <div class="meter" id="meter">
    <div class="meter-fill" id="meterFill"></div>
    <div class="meter-label" id="meterLabel"></div>
  </div>
  <div class="detail" id="detail"></div>
</div>
<script>
const stage = document.getElementById("stage");
const lineEl = document.getElementById("line");
const detailEl = document.getElementById("detail");
const meterFill = document.getElementById("meterFill");
const meterLabel = document.getElementById("meterLabel");
const POSES = ["sleep", "listen", "link", "download", "files", "sheets", "premiere", "done"];

function vis(state) {
  if (state === "working") return "working";
  if (state === "wake") return "wake";
  return "idle";
}

function normalizePose(state, pose) {
  if (pose === "laptop") return "download";
  if (pose === "desk") return "sheets";
  if (state === "wake") return "listen";
  if (POSES.includes(pose)) return pose;
  return state === "idle" ? "sleep" : "download";
}

function apply(data) {
  const state = vis(data.state);
  const pose = normalizePose(state, data.pose);
  stage.className = "stage " + state + " pose-" + pose;
  lineEl.textContent = data.line || (state === "idle" ? "zzz…" : "仕事してるよ…");
  detailEl.textContent = data.detail || "";
  if (state === "working") {
    if (data.progress == null || data.progress === "") {
      meterFill.style.width = "12%";
      meterLabel.textContent = "";
    } else {
      const pct = Math.max(0, Math.min(100, Number(data.progress)));
      meterFill.style.width = pct + "%";
      meterLabel.textContent = Math.round(pct) + "%";
    }
  } else {
    meterFill.style.width = "0%";
    meterLabel.textContent = "";
  }
}

async function poll() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    apply(await r.json());
  } catch (e) {}
}

setInterval(poll, 1000);
poll();
</script>
</body>
</html>
