<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ホッシーくん</title>
<style>
  :root {
    --text: #e8eaec;
    --muted: #9ca3af;
    --accent: #4f93e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0e0f10;
    color: var(--text);
    font-family: "Hiragino Sans", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    padding: 24px 24px 48px;
  }
  .char-wrap {
    position: relative;
    width: min(58vh, 480px);
    height: min(58vh, 480px);
  }
  .char {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    inset: 0;
    display: none;
  }
  .idle .char-sleep { display: block; animation: sleep 3.6s ease-in-out infinite; }
  .working .char-work { display: block; animation: work 1.1s ease-in-out infinite; }

  @keyframes sleep {
    0%, 100% { transform: translateY(8px); }
    50% { transform: translateY(0); }
  }
  @keyframes work {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-8px) rotate(1.5deg); }
  }

  .line {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
    min-height: 1.4em;
  }
  .detail {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    max-width: 42em;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="stage idle" id="stage">
  <div class="char-wrap">
    <img class="char char-sleep" src="/hosshy-sleep.png?v=5" alt="" />
    <img class="char char-work" src="/hosshy-work.png?v=5" alt="" />
  </div>
  <div class="line" id="line">zzz…</div>
  <div class="detail" id="detail"></div>
</div>
<script>
const stage = document.getElementById("stage");
const lineEl = document.getElementById("line");
const detailEl = document.getElementById("detail");

function vis(state) {
  return state === "working" ? "working" : "idle";
}

function apply(data) {
  const state = vis(data.state);
  stage.className = "stage " + state;
  if (state === "working") {
    lineEl.textContent = data.line || "仕事してるよ…";
    detailEl.textContent = data.detail || "";
  } else {
    lineEl.textContent = "zzz…";
    detailEl.textContent = "";
  }
}

async function poll() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    apply(await r.json());
  } catch (e) {}
}

setInterval(poll, 1000);
poll();
</script>
</body>
</html>
